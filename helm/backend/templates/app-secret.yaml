apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-app
  labels:
    app.kubernetes.io/name: {{ include "backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  jwt-secret: {{ required "env.jwtSecret must be set to a strong value (use --set-string or external secret management)" .Values.env.jwtSecret | quote }}
  google-places-api-key: {{ required "env.googlePlacesApiKey must be set (use --set-string or external secret management)" .Values.env.googlePlacesApiKey | quote }}
