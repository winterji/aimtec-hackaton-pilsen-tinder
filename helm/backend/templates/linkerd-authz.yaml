{{- if .Values.linkerd.enabled }}
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ include "backend.fullname" . }}-mesh
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Allow any valid meshed identity from within this namespace.
  identities:
    - "*.{{ .Release.Namespace }}.serviceaccount.cluster.local"
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: {{ include "backend.fullname" . }}-allow-mesh
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: {{ include "backend.fullname" . }}-http
  requiredAuthenticationRefs:
    - group: policy.linkerd.io
      kind: MeshTLSAuthentication
      name: {{ include "backend.fullname" . }}-mesh
{{- end }}
