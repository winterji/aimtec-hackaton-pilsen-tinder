{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "backend.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  postgres-user: {{ required "postgres.auth.username must be set" .Values.postgres.auth.username | quote }}
  postgres-password: {{ required "postgres.auth.password must be set to a strong value" .Values.postgres.auth.password | quote }}
  postgres-db: {{ required "postgres.auth.database must be set" .Values.postgres.auth.database | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s:%v/%s" (required "postgres.auth.username must be set" .Values.postgres.auth.username) (required "postgres.auth.password must be set to a strong value" .Values.postgres.auth.password) (include "backend.postgresServiceName" .) .Values.postgres.service.port (required "postgres.auth.database must be set" .Values.postgres.auth.database) | quote }}
{{- end }}
