replicaCount: 1

image:
  repository: jiwi/objevplzen
  tag: backend
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

env:
  nodeEnv: production
  # Required: set a strong random JWT secret using --set/--set-file or external secret management.
  jwtSecret: ""
  # Treat as sensitive and prefer --set-file/secret management in production.
  googlePlacesApiKey: ""

database:
  # Required when postgres.enabled=false.
  url: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    # Required: set strong custom credentials using --set/--set-file or external secret management.
    username: ""
    password: ""
    database: ""
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi

resources: {}
